<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW JOKER - ALL IN ONE</title>
    <style>
        :root {
            --glow: #00ffcc;
            --bg: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--glow);
            font-family: 'Segoe UI', sans-serif;
            /* প্রফেশনাল হ্যাকিং গ্রিড ব্যাকগ্রাউন্ড */
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        header {
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid var(--glow);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main {
            padding: 20px;
            padding-bottom: 100px;
            max-width: 500px;
            margin: auto;
        }

        /* স্পেশাল টুলস বাটন */
        .cyber-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #000;
            border: 2px solid var(--glow);
            color: var(--glow);
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            transition: 0.4s;
        }

        .cyber-btn:hover {
            background: var(--glow);
            color: #000;
            box-shadow: 0 0 25px var(--glow);
            transform: scale(1.02);
        }

        .card {
            background: rgba(0, 255, 204, 0.04);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        h3 {
            margin: 0 0 15px 0;
            font-size: 1rem;
            border-left: 3px solid var(--glow);
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--glow);
            color: var(--glow);
            padding: 15px 10px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .game-card:hover {
            background: rgba(0, 255, 204, 0.1);
            border-color: #fff;
        }

        .icon { font-size: 2rem; margin-bottom: 8px; }

        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--glow);
            color: #fff;
            margin-bottom: 10px;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #000;
            color: var(--glow);
            border: 1px solid var(--glow);
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }

        button:active { background: var(--glow); color: #000; }

        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            background: #000;
            border-top: 2px solid var(--glow);
        }

        nav button { flex: 1; border: none; font-size: 1.5rem; padding: 15px; border-radius: 0; }

        .hidden { display: none; }
        video { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px dashed var(--glow); }
    </style>
</head>
<body>

<header>🎭 SHADOW JOKER PRO</header>

<div class="main">

    <div id="home">
        
        <a href="https://cyber-team-help-all-in-one.vercel.app/" target="_blank" class="cyber-btn">
            <span>🛠️</span> CYBER TEAM ALL TOOLS
        </a>

        <div class="card">
            <h3>🛡️ Terminal Tools</h3>
            <input id="ipInput" placeholder="Enter IP Address">
            <button onclick="ipLookup()">Scan IP</button>
            <button onclick="genPass()" style="margin-top:10px;">Generate Password</button>
        </div>

        <div class="card">
            <h3>🌐 System Center</h3>
            <div class="grid">
                <button onclick="checkNet()">Net Status</button>
                <button onclick="openCamera()">Live Cam</button>
            </div>
            <video id="cam" autoplay playsinline></video>
        </div>

        <div class="card">
            <h3>📱 Contact Dev</h3>
            <div class="grid">
                <a href="https://t.me/shadow_joker_cyberteamhelp" target="_blank" class="game-card">
                    <span class="icon">✈️</span> Telegram
                </a>
                <a href="https://wa.me/8801950178309" target="_blank" class="game-card">
                    <span class="icon">💬</span> WhatsApp
                </a>
            </div>
        </div>
    </div>

    <div id="game" class="hidden">
        <div class="card">
            <h3>🎮 Games Dashboard</h3>
            <div class="grid">
                <a href="https://poki.com" target="_blank" class="game-card">
                    <span class="icon">🕹️</span> Poki Games
                </a>
                <a href="https://www.crazygames.com" target="_blank" class="game-card">
                    <span class="icon">🔥</span> CrazyGames
                </a>
                <a href="https://poki.com/en/g/subway-surfers" target="_blank" class="game-card">
                    <span class="icon">🏃</span> Subway Surfer
                </a>
                <a href="https://slither.io" target="_blank" class="game-card">
                    <span class="icon">🐍</span> Slither.io
                </a>
                <a href="https://www.y8.com" target="_blank" class="game-card">
                    <span class="icon">🎮</span> Y8 Games
                </a>
                <a href="https://poki.com/en/g/temple-run-2" target="_blank" class="game-card">
                    <span class="icon">🗿</span> Temple Run 2
                </a>
            </div>
        </div>
    </div>

</div>

<nav>
    <button onclick="showHome()">🏠</button>
    <button onclick="openGame()">🎮</button>
</nav>

<script>
    function showHome(){
        document.getElementById("home").classList.remove("hidden");
        document.getElementById("game").classList.add("hidden");
    }
    function openGame(){
        document.getElementById("home").classList.add("hidden");
        document.getElementById("game").classList.remove("hidden");
    }

    function checkNet(){
        alert(navigator.onLine ? "Connected 🟢" : "Disconnected 🔴");
    }

    async function openCamera(){
        try {
            let s = await navigator.mediaDevices.getUserMedia({video:true});
            document.getElementById("cam").srcObject = s;
        } catch { alert("Access Denied!"); }
    }

    function genPass(){
        let p = Math.random().toString(36).slice(-8).toUpperCase();
        alert("Pass: " + p);
    }

    async function ipLookup(){
        let ip = document.getElementById("ipInput").value;
        try {
            let res = await fetch(`https://ipapi.co/${ip}/json/`);
            let data = await res.json();
            alert("Location: " + data.city + ", " + data.country_name);
        } catch { alert("Error!"); }
    }
</script>

</body>
</html>
