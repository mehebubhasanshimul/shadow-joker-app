<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW JOKER - CYBER HUB</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --neon-primary: #00ffcc;
            --neon-secondary: #ff00ff;
            --neon-blue: #00bfff;
            --dark: #0a0a0a;
            --dark-secondary: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--neon-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Cyber Background */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(45deg, var(--dark), var(--dark-secondary));
        }

        .grid-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0,255,204,0.1) 1px, transparent 1px),
                radial-gradient(circle at 80% 20%, rgba(255,0,255,0.1) 1px, transparent 1px),
                radial-gradient(circle at 40% 40%, rgba(0,191,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: linear-gradient(45deg, var(--neon-primary), var(--neon-secondary));
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        .scan-lines::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,204,0.1), transparent);
            animation: scan 3s linear infinite;
            z-index: -1;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        header {
            text-align: center;
            padding: 25px 20px;
            font-size: 2rem;
            font-weight: 900;
            background: rgba(0,0,0,0.9);
            border-bottom: 3px solid transparent;
            position: relative;
            animation: neonGlow 2s ease-in-out infinite alternate;
            text-transform: uppercase;
            letter-spacing: 3px;
            backdrop-filter: blur(10px);
        }

        @keyframes neonGlow {
            from { box-shadow: 0 0 20px var(--neon-primary), 0 0 40px var(--neon-primary); }
            to { box-shadow: 0 0 30px var(--neon-secondary), 0 0 60px var(--neon-secondary); }
        }

        .container {
            padding: 25px 20px;
            padding-bottom: 120px;
            max-width: 550px;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .main-tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: linear-gradient(45deg, rgba(0,0,0,0.9), rgba(17,17,17,0.9));
            border: 2px solid transparent;
            color: var(--neon-primary);
            padding: 22px 25px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            border-radius: 20px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
        }

        .main-tool-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,204,0.3), transparent);
            transition: left 0.5s;
        }

        .main-tool-btn:hover::before {
            left: 100%;
        }

        .main-tool-btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--neon-primary);
            box-shadow: 0 15px 35px rgba(0,255,204,0.4);
        }
